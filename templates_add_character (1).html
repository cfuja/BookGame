<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Character - Book Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Add Character</h1>
        <p>Fill in the character details. Only Name and Age are required.</p>
        
        <a href="{{ url_for('index') }}" class="button">Back to Home</a>
        
        <form method="post">
            <label>Name: <input type="text" name="name" required></label>
            <label>Age: <input type="number" name="age" value="0" required></label>
            <label>Gender: <input type="text" name="gender" placeholder="Not specified"></label>
            <label>Occupation: <input type="text" name="occupation" placeholder="Not specified"></label>
            <label>Personality: <input type="text" name="personality" placeholder="Not specified"></label>
            <label>Backstory: <input type="text" name="backstory" placeholder="Not specified"></label>
            <label>Physical Traits: <input type="text" name="physical_traits" placeholder="Not specified"></label>
            <label>Motivations: <input type="text" name="motivations" placeholder="Not specified"></label>
            <label>Relationships (e.g., John: Friend, Jane: Enemy): <input type="text" name="relationships"></label>
            <button type="submit">Add Character</button>
        </form>
        
        <div class="output">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message | safe }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>
    </div>
</body>
</html>
